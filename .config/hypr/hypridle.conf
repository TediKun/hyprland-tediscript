# ███████║ ╚████╔╝ ██████╔╝██████╔╝██║██║  ██║██║     █████╗  
# ██╔══██║  ╚██╔╝  ██╔═══╝ ██╔══██╗██║██║  ██║██║     ██╔══╝  
# ██║  ██║   ██║   ██║     ██║  ██║██║██████╔╝███████╗███████╗
# ╚═╝  ╚═╝   ╚═╝   ╚═╝     ╚═╝  ╚═╝╚═╝╚═════╝ ╚══════╝╚══════╝
                           
general {
    lock_cmd = $HOME/.config/hypr/scripts/lock-screen                         # lock screen and 1password
    before_sleep_cmd = loginctl lock-session               # lock before suspend.
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"  # avoid double keypress after wake
    inhibit_sleep = 3                                      # wait until screen is locked
}

listener {
    timeout = 150                                             # 2.5min
    on-timeout = pidof hyprlock || $HOME/.config/hypr/scripts/screensaver-launch # start screensaver (if we haven't locked already)
}

listener {
    timeout = 300                      # 5min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = 330                                            # 5.5min
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })" # screen off on timeout
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })" && brightnessctl -r # screen on
}
